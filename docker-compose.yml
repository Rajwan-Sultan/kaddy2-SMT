version: '3.8'

services:
  kaddy-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kaddy-scam-detector
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    env_file:
      - .env
    volumes:
      - ./:/app
      - /tmp:/tmp
    restart: unless-stopped
    networks:
      - kaddy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/analyzer_audio_stream/info"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  kaddy-network:
    driver: bridge
